name: Release Packages

on:
  workflow_dispatch:

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm (Manual Approval Required)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        run: pnpm verify

      - name: Build packages
        run: pnpm build

      # npm provenance is only supported for public source repositories.
      - name: Publish changesets
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
